[config]
schemaVersion = "0.0.1"

[package]
namespace = "OsmarBriones"
name = "DucksEverywhere"
versionNumber = "1.0.1"
description = "Spawns rubber ducks in the truck and facility on level load. Fully configurable. Only Host, clients don't need it."
websiteUrl = "https://github.com/OsmarBriones/DucksEverywhere"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2304"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./dist"

[[build.copy]]
source = "./dist/DucksEverywhere.dll"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = [ "repo" ]

[publish.categories]
repo = []